<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chicago Weather</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #4fc3f7;
      --text: #e8f4fd;
      --muted: rgba(232,244,253,0.45);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* Subtle animated background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(79,195,247,0.12), transparent),
                  radial-gradient(ellipse 60% 40% at 80% 100%, rgba(100,130,255,0.08), transparent);
      pointer-events: none;
    }

    .widget {
      text-align: center;
      padding: 2.5rem 3.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      min-width: 340px;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .city {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .condition-icon {
      font-size: 3.5rem;
      line-height: 1;
      margin: 0.5rem 0;
      display: block;
      filter: drop-shadow(0 0 18px rgba(79,195,247,0.4));
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .temp {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 7rem;
      line-height: 1;
      color: var(--text);
      letter-spacing: -0.02em;
      text-shadow: 0 0 40px rgba(79,195,247,0.25);
    }

    .temp sup {
      font-size: 2.5rem;
      vertical-align: super;
      opacity: 0.7;
    }

    .condition {
      font-size: 1rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.4rem;
    }

    .divider {
      width: 40px; height: 1px;
      background: var(--border);
      margin: 1.2rem auto;
    }

    .details {
      display: flex;
      gap: 2rem;
      justify-content: center;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .detail-label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .detail-value {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text);
    }

    .updated {
      margin-top: 1.4rem;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: rgba(232,244,253,0.2);
      text-transform: uppercase;
    }

    .loading, .error {
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="loading">Loading weather…</div>
  </div>

  <script>
    const WMO_MAP = {
      0:  ['☀️','Clear'],
      1:  ['🌤️','Mostly Clear'],  2: ['⛅','Partly Cloudy'], 3: ['☁️','Overcast'],
      45: ['🌫️','Fog'],           48:['🌫️','Icy Fog'],
      51: ['🌦️','Light Drizzle'], 53:['🌦️','Drizzle'],      55:['🌧️','Heavy Drizzle'],
      61: ['🌧️','Light Rain'],    63:['🌧️','Rain'],          65:['🌧️','Heavy Rain'],
      71: ['🌨️','Light Snow'],    73:['❄️','Snow'],          75:['❄️','Heavy Snow'],
      77: ['🌨️','Snow Grains'],
      80: ['🌦️','Light Showers'], 81:['🌧️','Showers'],      82:['⛈️','Heavy Showers'],
      85: ['🌨️','Snow Showers'],  86:['❄️','Heavy Snow Showers'],
      95: ['⛈️','Thunderstorm'],  96:['⛈️','Thunderstorm+Hail'], 99:['⛈️','Severe Thunderstorm'],
    };

    function fmtTime(iso) {
      return new Date(iso).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
    }

    async function fetchWeather() {
      const url = 'https://api.open-meteo.com/v1/forecast' +
        '?latitude=41.85&longitude=-87.65' +
        '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weathercode' +
        '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago';

      const res  = await fetch(url);
      const data = await res.json();
      const c    = data.current;
      const [icon, condition] = WMO_MAP[c.weathercode] || ['🌡️','Unknown'];

      const tempF    = Math.round(c.temperature_2m);
      const feelsF   = Math.round(c.apparent_temperature);
      const humidity = Math.round(c.relative_humidity_2m);
      const wind     = Math.round(c.wind_speed_10m);
      const updated  = fmtTime(c.time);

      document.getElementById('widget').innerHTML = `
        <div class="city">Chicago, IL</div>
        <span class="condition-icon">${icon}</span>
        <div class="temp">${tempF}<sup>°F</sup></div>
        <div class="condition">${condition}</div>
        <div class="divider"></div>
        <div class="details">
          <div class="detail-item">
            <span class="detail-label">Feels Like</span>
            <span class="detail-value">${feelsF}°</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Humidity</span>
            <span class="detail-value">${humidity}%</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Wind</span>
            <span class="detail-value">${wind} mph</span>
          </div>
        </div>
        <div class="updated">Updated ${updated}</div>
      `;
    }

    fetchWeather().catch(() => {
      document.getElementById('widget').innerHTML =
        '<div class="error">⚠️ Unable to load weather</div>';
    });

    // Refresh every 10 minutes
    setInterval(() => fetchWeather().catch(()=>{}), 600000);
  </script>
</body>
</html>
